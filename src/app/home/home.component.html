<div class="home-page">
    <section class="hero">
        <div class="hero-copy">
            <p class="eyebrow">CAKELIA CAKE STUDIO</p>
            <h1>Delicious Cakes<br>For Every Occasion</h1>
            <p class="hero-subtitle">Made with love,<br>just for you.</p>
            <button class="primary-btn" type="button" (click)="orderNow()">ORDER NOW</button>
        </div>
        <!-- <div class="hero-image-wrap">
            <img class="hero-cake" [src]="heroSlides[currentSlide].image" [alt]="heroSlides[currentSlide].alt">
        </div> -->
        <!-- <div class="slider-dots">
            <button *ngFor="let slide of heroSlides; let i = index" type="button" [class.active]="i === currentSlide"
                (click)="selectSlide(i)" [attr.aria-label]="'Slide ' + (i + 1)"></button>
        </div> -->
    </section>

    <section class="section-block">
        <div class="section-heading">
            <h2>Categories</h2><button type="button" (click)="viewAllCategories()">View All</button>
        </div>
        <div class="category-grid">
            <button class="category-card" type="button" *ngFor="let category of categories"
                (click)="selectCategory(category.name)">
                <!-- <span class="category-icon" [innerHTML]="category.icon"></span> -->
                <img [src]="category.icon" [alt]="category.name" loading="lazy">
                <span>{{ category.name }}</span>
            </button>
        </div>
    </section>

    <section class="section-block best-sellers">
        <div class="section-heading">
            <h2>Best Sellers</h2><button type="button" (click)="viewAllProducts()">View All</button>
        </div>
        <div class="products-grid">
            <article class="product-card" *ngFor="let product of products">
                <button class="product-image-btn" type="button" (click)="openProduct(product.id)">
                    <img [src]="product.image" [alt]="product.name" loading="lazy">
                </button>
                <div class="product-info">
                    <h3>{{ product.name }}</h3>
                    <div class="product-bottom">
                        <!-- <span class="price">₹{{ product.price }}</span> -->
                        <button class="add-btn" type="button" (click)="addToCart(product)">+</button>
                    </div>
                </div>
            </article>
        </div>
    </section>

    <div class="toast" *ngIf="toastMessage">{{ toastMessage }}</div>
</div>
