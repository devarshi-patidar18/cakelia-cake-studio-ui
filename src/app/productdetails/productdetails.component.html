<div class="product-page">
  <header class="product-header">
    <button class="header-icon" (click)="goBack()" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>
    </button>
    <h1>Product Details</h1>
    <button class="header-icon cart-button" (click)="openCart()" aria-label="Cart">
      <svg viewBox="0 0 24 24"><path d="M3 4h2l2.1 10.1a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 1.9-1.4L20.5 8H6"/><circle cx="9" cy="20" r="1.2"/><circle cx="18" cy="20" r="1.2"/></svg>
      <span>{{cartCount}}</span>
    </button>
  </header>

  <main class="product-container">
    <section class="gallery">
      <div class="main-image">
        <button class="wishlist" [class.active]="favorite" (click)="toggleWishlist()">♡</button>
        <button class="gallery-arrow left" *ngIf="images.length>1" (click)="previousImage()">‹</button>
        <img [src]="images[currentImage]" [alt]="product.name">
        <button class="gallery-arrow right" *ngIf="images.length>1" (click)="nextImage()">›</button>
      </div>
      <div class="dots">
        <button *ngFor="let image of images;let i=index" [class.active]="i===currentImage" (click)="selectImage(i)"></button>
      </div>
      <div class="thumbnails" *ngIf="images.length>1">
        <button *ngFor="let image of images;let i=index" [class.active]="i===currentImage" (click)="selectImage(i)">
          <img [src]="image" [alt]="product.name">
        </button>
      </div>
    </section>

    <section class="details">
      <div class="title-row">
        <div><h2>{{product.name}}</h2><div class="price">₹{{unitPrice}}</div></div>
        <span class="available" *ngIf="product.available">Available</span>
      </div>

      <p class="description">{{product.description}}</p>

      <div class="option">
        <label>Size <b>{{selectedSize}}</b></label>
        <div class="options">
          <button *ngFor="let size of sizes" [class.selected]="selectedSize===size" (click)="selectSize(size)">{{size}}</button>
        </div>
      </div>

      <div class="option">
        <label>Flavor <b>{{selectedFlavor}}</b></label>
        <div class="options">
          <button *ngFor="let flavor of flavors" [class.selected]="selectedFlavor===flavor" (click)="selectFlavor(flavor)">{{flavor}}</button>
        </div>
      </div>

      <div class="option">
        <label>Quantity</label>
        <div class="quantity">
          <button (click)="decreaseQuantity()">−</button>
          <span>{{quantity}}</span>
          <button (click)="increaseQuantity()">+</button>
        </div>
      </div>

      <div class="summary">
        <div><span>Unit Price</span><b>₹{{unitPrice}}</b></div>
        <div><span>Quantity</span><b>× {{quantity}}</b></div>
        <div class="total"><span>Total</span><b>₹{{totalPrice}}</b></div>
      </div>
    </section>
  </main>

  <footer class="actions">
    <button class="add" [disabled]="!product.available" (click)="addToCart()">ADD TO CART</button>
    <button class="buy" [disabled]="!product.available" (click)="buyNow()">BUY NOW</button>
  </footer>

  <div class="toast" *ngIf="toast">{{toast}}</div>
</div>
