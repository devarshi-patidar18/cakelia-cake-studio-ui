<header class="header">
  <div class="container">

    <a class="logo" routerLink="/">
      <img src="assets/ccs_without_bg.png" alt="Cakelia Cake Studio">
    </a>

    <nav class="nav" [class.active]="menuOpen">
      <a routerLink="/" (click)="toggleMenu()">Home</a>
      <a routerLink="/cakes" (click)="toggleMenu()">Cakes</a>
      <a routerLink="/gallery" (click)="toggleMenu()">Gallery</a>
      <a routerLink="/about" (click)="toggleMenu()">About</a>
      <a routerLink="/contact" (click)="toggleMenu()">Contact</a>

      <button class="shine-btn" (click)="orderNow(); toggleMenu();">
                Order Now
                <span class="shine"></span>

                <span class="star star1">✦</span>
                <span class="star star2">✦</span>
                <span class="star star3">✦</span>
            </button>
    </nav>

    <button class="menu-btn"
            (click)="toggleMenu()"
            aria-label="Toggle Menu">

      <span></span>
      <span></span>
      <span></span>

    </button>

  </div>
</header>
