<div class="loader-overlay" *ngIf="loaderService.loading$ | async">

  <div class="loader-content">

    <video
      #loaderVideo
      class="loader-video"
      autoplay
      muted
      playsinline
      loop>
      <source
        src="assets/loader/cakelia-loader.mp4"
        type="video/mp4">
    </video>

  </div>

</div>
